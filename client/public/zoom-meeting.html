<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
        }
        #zmmtg-root { width: 100%; height: 100%; }
        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 100;
        }
        .loading.hidden { display: none; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            text-align: center;
            color: white;
        }
        .error.visible { display: flex; }
        .error-icon {
            width: 64px;
            height: 64px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>
    
    <div id="error" class="error">
        <div class="error-icon">!</div>
        <h2>Meeting Error</h2>
        <p id="error-message">Failed to join meeting</p>
    </div>

    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/zoom-meeting-3.1.6.min.js"></script>
    <script>
        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        const meetingNumber = params.get('meetingId') || '';
        const password = params.get('password') || '';
        const userName = params.get('userName') || 'Participant';
        const sdkKey = params.get('sdkKey') || '';
        const signature = params.get('signature') || '';
        const isHost = params.get('isHost') === 'true';

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMsgEl = document.getElementById('error-message');

        function showError(msg) {
            loadingEl.classList.add('hidden');
            errorEl.classList.add('visible');
            errorMsgEl.textContent = msg;
            console.error('Zoom Error:', msg);
        }

        async function initZoom() {
            try {
                if (!meetingNumber || !signature || !sdkKey) {
                    showError('Missing meeting parameters. Please return to the app and try again.');
                    return;
                }

                console.log('Initializing Zoom...', { meetingNumber, userName, isHost });

                // Configure and join
                ZoomMtg.preLoadWasm();
                ZoomMtg.prepareWebSDK();

                ZoomMtg.init({
                    leaveUrl: window.location.href,
                    isSupportAV: true,
                    success: () => {
                        console.log('Zoom initialized, joining...');
                        
                        ZoomMtg.join({
                            meetingNumber: meetingNumber.replace(/\D/g, ''),
                            userName: userName,
                            passWord: password,
                            signature: signature,
                            sdkKey: sdkKey,
                            success: () => {
                                console.log('Joined successfully');
                                loadingEl.classList.add('hidden');
                                
                                // Notify parent window
                                if (window.parent !== window) {
                                    window.parent.postMessage({ type: 'ZOOM_JOINED' }, '*');
                                }
                            },
                            error: (err) => {
                                showError('Failed to join: ' + (err?.message || err || 'Unknown error'));
                            }
                        });
                    },
                    error: (err) => {
                        showError('Init failed: ' + (err?.message || err || 'Unknown error'));
                    }
                });
            } catch (err) {
                showError('Error: ' + (err?.message || err || 'Unknown error'));
            }
        }

        // Initialize when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initZoom);
        } else {
            initZoom();
        }
    </script>
</body>
</html>
