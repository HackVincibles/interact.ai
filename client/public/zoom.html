<!DOCTYPE html>
<html>
<head>
    <title>Zoom Session</title>
    <meta charset="utf-8" />
    <style>
        body { background-color: #000; margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
        #zmmtg-root { width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
        .loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: sans-serif; z-index: 1000; background: #000;
        }
        .error-btn {
            margin-top: 20px; padding: 10px 20px; background: #6366f1; color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Initializing Zoom Engine...</div>
        <div id="status-msg" style="font-size: 14px; opacity: 0.7;">Connecting to platform service...</div>
    </div>
    
    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/3.5.2/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.5.2/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.5.2/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.5.2/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.5.2/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.5.2.min.js"></script>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const meetingNumber = params.get("meetingNumber") ? params.get("meetingNumber").replace(/\D/g, "") : "";
            const signature = params.get("signature");
            const sdkKey = params.get("sdkKey");
            const password = params.get("password") ? params.get("password").trim() : "";
            const userName = params.get("userName") || "Participant";
            const userEmail = params.get("userEmail") || "participant@interact.ai";

            console.log("Zoom Parameters:", {
                meetingNumber,
                hasSignature: !!signature,
                hasSdkKey: !!sdkKey,
                hasPassword: !!password,
                userName
            });

            if (!meetingNumber || !signature || !sdkKey) {
                const missing = [];
                if (!meetingNumber) missing.push("Meeting Number");
                if (!signature) missing.push("Signature");
                if (!sdkKey) missing.push("SDK Key");
                document.getElementById('status-msg').innerHTML = "Error: Missing " + missing.join(", ");
                return;
            }

            document.getElementById('status-msg').innerHTML = "Loading Zoom Web Assets...";
            
            ZoomMtg.setZoomJSLib("https://source.zoom.us/3.5.2/lib", "/av");
            ZoomMtg.preLoadWasm();
            ZoomMtg.prepareWebSDK();
            ZoomMtg.i18n.load('en-US');

            document.getElementById('status-msg').innerHTML = "Initializing Engine...";

            ZoomMtg.init({
                leaveUrl: window.location.origin + "/gd",
                isSupportAV: true,
                success: function() {
                    console.log("Zoom SDK Init Success");
                    document.getElementById('status-msg').innerHTML = "Joining Meeting...";
                    
                    const joinTimeout = setTimeout(() => {
                        if (document.getElementById('loading').style.display !== 'none') {
                            document.getElementById('status-msg').innerHTML = 
                                "<div style='color:#f59e0b'>Joining is taking longer than expected...</div>" +
                                "<button class='error-btn' style='background:#10b981' onclick='window.location.reload()'>Retry Connection</button>";
                        }
                    }, 15000);

                    ZoomMtg.join({
                        meetingNumber: meetingNumber,
                        signature: signature,
                        sdkKey: sdkKey,
                        userName: userName,
                        password: password,
                        passWord: password,
                        userEmail: userEmail,
                        success: function() {
                            clearTimeout(joinTimeout);
                            console.log("Zoom Join Success");
                            document.getElementById('loading').style.display = 'none';
                        },
                        error: function(err) {
                            clearTimeout(joinTimeout);
                            console.error("Zoom Join Error:", err);
                            let errorMsg = err.errorMessage || "Unknown join error";
                            document.getElementById('status-msg').innerHTML = 
                                "<div style='color:#ef4444; margin-bottom: 10px;'>Join Error: " + errorMsg + "</div>" +
                                "<div style='font-size: 12px; opacity: 0.7; margin-bottom: 15px;'>Code: " + err.errorCode + "</div>" +
                                "<button class='error-btn' onclick='window.open(\"https://zoom.us/j/" + meetingNumber + "?pwd=" + password + "\", \"_blank\")'>Join Directly via Zoom</button>";
                        }
                    });
                },
                error: function(err) {
                    console.error("Zoom Init Error:", err);
                    document.getElementById('status-msg').innerHTML = "Init Error: " + (err.errorMessage || "Check browser compatibility");
                }
            });
        })();
    </script>
</body>
</html>
