<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoom Meeting</title>
  <style>
    body{margin:0;background:#000;height:100vh;overflow:hidden;}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a2e;z-index:100;}
    #loading.hidden{display:none;}
    .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1a1a2e;flex-direction:column;gap:16px;padding:24px;text-align:center;color:white;}
    #error.visible{display:flex;}
    .error-icon{width:64px;height:64px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;}
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <div id="error"><div class="error-icon">!</div><h2>Meeting Error</h2><p id="error-msg">Failed to join</p></div>
  <div id="zmmtg-root" style="width:100%;height:100%;"></div>
  <script src="https://source.zoom.us/zoom-meeting-3.1.6.min.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const meetingNumber = p.get('m');
    const pwd = p.get('p') || '';
    const name = p.get('n') || 'User';
    const sdkKey = p.get('k') || '';
    const sig = p.get('s') || '';
    
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const errorMsgEl = document.getElementById('error-msg');
    
    function showError(msg) {
      loadingEl.classList.add('hidden');
      errorEl.classList.add('visible');
      errorMsgEl.textContent = msg;
      parent.postMessage('error:' + msg, '*');
    }
    
    if (!meetingNumber || !sdkKey || !sig) {
      showError('Missing meeting parameters. Please return to the app and try again.');
    } else {
      ZoomMtg.preLoadWasm();
      ZoomMtg.prepareWebSDK();
      ZoomMtg.init({
        leaveUrl: location.href,
        isSupportAV: true,
        success: () => {
          ZoomMtg.join({
            meetingNumber: meetingNumber,
            userName: name,
            passWord: pwd,
            signature: sig,
            sdkKey: sdkKey,
            success: () => {
              loadingEl.classList.add('hidden');
              parent.postMessage('joined', '*');
            },
            error: (err) => showError('Failed to join: ' + (err?.message || err || 'Unknown error'))
          });
        },
        error: (err) => showError('Init failed: ' + (err?.message || err || 'Unknown error'))
      });
    }
  </script>
</body>
</html>
